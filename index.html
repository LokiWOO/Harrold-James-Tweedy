<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Dossier Civil</title>

<style>

body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#2f2f2f;
    font-family:"Courier New", monospace;
}

.dossier{
    width:850px;
    height:550px;
    background:#d8c9a2;
    border:4px solid #9b7a45;
    box-shadow:0 0 30px rgba(0,0,0,.6);
    padding:50px;
    position:relative;
}

h1{
    text-align:center;
    margin-top:70px;
    font-size:60px;
    letter-spacing:8px;
}

h2{
    text-align:center;
    font-weight:normal;
}

.tampon{
    position:absolute;
    top:50px;
    right:60px;
    border:5px solid darkred;
    color:darkred;
    padding:10px 25px;
    font-size:30px;
    transform:rotate(-10deg);
}

.infos{
    margin-top:70px;
    line-height:40px;
    font-size:22px;
}

.btn{
    position:absolute;
    bottom:50px;
    left:50%;
    transform:translateX(-50%);

    background:#23486a;
    color:white;

    text-decoration:none;

    padding:15px 40px;

    border-radius:8px;
}

</style>
</head>
<body>

<div class="dossier">

<div class="tampon">ACTIF</div>

<h1>DOSSIER CIVIL</h1>

<h2>État de San Andreas</h2>

<div class="infos">

<p><b>Nom :</b> Harrold James Tweedy</p>

<p><b>Référence :</b> LS-HT-3584</p>

<p><b>Classification :</b> Archive Civile</p>

</div>

<a class="btn" href="dossier/page1.html">
OUVRIR LE DOSSIER
</a>

</div>

</body>
</html>
