<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dossier Civil - Harrold James Tweedy</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    background:#2c2c2c;

    font-family:"Courier New", monospace;

}

.dossier{

    width:700px;
    height:980px;

    background-image:url("cover.png");
    background-size:contain;
    background-repeat:no-repeat;
    background-position:center;

    position:relative;

}

.titre{

    position:absolute;

    top:150px;

    width:100%;

    text-align:center;

    color:#2a1f0f;

    text-shadow:1px 1px 2px rgba(255,255,255,.2);

}

.titre h1{

    font-size:64px;

    letter-spacing:8px;

}

.titre h2{

    margin-top:15px;

    font-size:28px;

    font-weight:normal;

}

.reference{

    position:absolute;

    top:400px;

    left:110px;

    font-size:24px;

    color:#382a16;

    line-height:45px;

}

.tampon{

    position:absolute;

    top:200px;

    right:80px;

    border:5px solid #8d0000;

    color:#8d0000;

    padding:15px 25px;

    font-size:28px;

    font-weight:bold;

    transform:rotate(-12deg);

}

.bouton{

    position:absolute;

    bottom:120px;

    left:50%;

    transform:translateX(-50%);

    background:#2c4f72;

    color:white;

    text-decoration:none;

    padding:18px 45px;

    border-radius:8px;

    font-size:22px;

    transition:.2s;

}

.bouton:hover{

    background:#41688d;

}

.signature{

    position:absolute;

    bottom:200px;

    width:100%;

    text-align:center;

    color:#5a4627;

    font-size:18px;

}

</style>
</head>
<body>

<div class="dossier">

    <div class="tampon">
        ACTIF
    </div>

    <div class="titre">

        <h1>DOSSIER</h1>

        <h2>CIVIL</h2>

    </div>

    <div class="reference">

        <p><strong>Nom :</strong> Harrold James Tweedy</p>

        <p><strong>Dossier :</strong> LS-HT-3584</p>

        <p><strong>Statut :</strong> Citoyen enregistré</p>

        <p><strong>Classification :</strong> Archive civile</p>

    </div>

    <div class="signature">

        État de San Andreas<br>
        Los Santos Civil Records

    </div>

    <a href="dossier/page1.html" class="bouton">

        OUVRIR LE DOSSIER

    </a>

</div>

</body>
</html>
